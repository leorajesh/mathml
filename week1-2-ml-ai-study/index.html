<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ML & Mathematics for AI Study Map</title>
    <script>
      // Pick the theme before the first paint: the saved choice, else the system setting.
      (function () {
        var theme = null;
        try { theme = localStorage.getItem('mathml-study:theme'); } catch (e) {}
        if (theme !== 'dark' && theme !== 'light') theme = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
